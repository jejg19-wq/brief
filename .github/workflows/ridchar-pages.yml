name: Publicar el espacio de Ridchar

on:
  push:
    branches: [claude/ridchar-primo-project-9mwtp8]
    paths: ['ridchar/**', '.github/workflows/ridchar-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar /ridchar/ en gh-pages (sin tocar el resto del sitio)
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/site \
            || { mkdir -p /tmp/site && cd /tmp/site && git init -b gh-pages; }
          mkdir -p /tmp/site/ridchar
          cp ridchar/index.html ridchar/og.png /tmp/site/ridchar/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Actualizar el espacio de Ridchar en GitHub Pages"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
